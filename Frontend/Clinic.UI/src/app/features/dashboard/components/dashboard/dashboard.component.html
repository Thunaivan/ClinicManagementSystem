
<h1>Dashboard</h1>

<!-- <p>Welcome back!</p> -->

<div class="stats-grid">

    <mat-card class="stat-card patients-card">

        <mat-icon>groups</mat-icon>

        <h2>Patients</h2>

        <h1>1254</h1>

    </mat-card>

    <mat-card class="stat-card doctors-card">

        <mat-icon>medical_services</mat-icon>

        <h2>Doctors</h2>

        <h1>24</h1>

    </mat-card>

    <mat-card class="stat-card departments-card">

        <mat-icon>apartment</mat-icon>

        <h2>Departments</h2>

        <h1>8</h1>

    </mat-card>

    <mat-card class="stat-card appointments-card">

        <mat-icon>event</mat-icon>

        <h2>Appointments</h2>

        <h1>37</h1>

    </mat-card>
    

</div>
<div class="dashboard-content">

    <!-- Today's Appointments -->

    <mat-card class="dashboard-panel">

        <mat-card-header>
            <mat-card-title>Today's Appointments</mat-card-title>
        </mat-card-header>

        <mat-card-content>

            <table class="dashboard-table">

                <tr>
                    <th>Time</th>
                    <th>Patient</th>
                    <th>Status</th>
                </tr>

                <tr>
                    <td>09:00</td>
                    <td>Ravi Kumar</td>
                    <td><span class="status waiting">Waiting</span></td>
                </tr>

                <tr>
                    <td>09:20</td>
                    <td>Priya Sharma</td>
                    <td><span class="status confirmed">Confirmed</span></td>
                </tr>

                <tr>
                    <td>10:00</td>
                    <td>Karthik</td>
                    <td><span class="status completed">Completed</span></td>
                </tr>

            </table>

        </mat-card-content>

    </mat-card>


    <!-- Quick Actions -->

    <mat-card class="dashboard-panel">

        <mat-card-header>
            <mat-card-title>Quick Actions</mat-card-title>
        </mat-card-header>

        <mat-card-content>

            <div class="quick-actions">

                <button mat-raised-button color="primary">
                    <mat-icon>person_add</mat-icon>
                    Register Patient
                </button>

                <button mat-raised-button color="primary">
                    <mat-icon>event</mat-icon>
                    Book Appointment
                </button>

                <button mat-raised-button color="primary">
                    <mat-icon>medical_services</mat-icon>
                    Add Doctor
                </button>

                <button mat-raised-button color="primary">
                    <mat-icon>receipt_long</mat-icon>
                    Generate Bill
                </button>

            </div>

        </mat-card-content>

    </mat-card>

</div>
