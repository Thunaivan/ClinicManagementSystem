<mat-card>

  <mat-card-header>
    <mat-card-title>Edit Patient</mat-card-title>
    <mat-card-subtitle>Update patient information</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>

    <form
      [formGroup]="patientForm"
      (ngSubmit)="onSubmit()">

      <div class="form-grid">

        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>First Name</mat-label>

          <input
            matInput
            formControlName="firstName">

          <mat-error *ngIf="patientForm.get('firstName')?.hasError('required')">
            First Name is required
          </mat-error>
        </mat-form-field>


        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Last Name</mat-label>

          <input
            matInput
            formControlName="lastName">

          <mat-error *ngIf="patientForm.get('lastName')?.hasError('required')">
            Last Name is required
          </mat-error>
        </mat-form-field>


        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Gender</mat-label>

          <mat-select formControlName="gender">

            <mat-option
              *ngFor="let gender of genders"
              [value]="gender.value">

              {{ gender.display }}

            </mat-option>

          </mat-select>
        </mat-form-field>


        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Date of Birth</mat-label>

          <input
            matInput
            [matDatepicker]="picker"
            formControlName="dateOfBirth">

          <mat-datepicker-toggle
            matSuffix
            [for]="picker">
          </mat-datepicker-toggle>

          <mat-datepicker #picker></mat-datepicker>

        </mat-form-field>


        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Phone Number</mat-label>

          <input
            matInput
            formControlName="phoneNumber">

        </mat-form-field>


        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Email</mat-label>

          <input
            matInput
            type="email"
            formControlName="email">

        </mat-form-field>


        <mat-form-field
          appearance="outline"
          subscriptSizing="dynamic"
          class="address-field">

          <mat-label>Address</mat-label>

          <textarea
            matInput
            rows="2"
            formControlName="address">
          </textarea>

        </mat-form-field>

      </div>

      <div class="form-actions">

        <button
          mat-button
          type="button"
          (click)="cancel()">

          Cancel

        </button>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="isLoading">

          Update

        </button>

      </div>

    </form>

  </mat-card-content>

</mat-card>
