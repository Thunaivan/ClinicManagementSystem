<div class="patient-page">
<div class="page-header">

  <div class="page-title-section">

    <div>
      <h1>Patients</h1>
      <p>Manage patient records and registrations</p>
    </div>

    <button
      mat-raised-button
      color="primary"
      (click)="addPatient()">

      <mat-icon>add</mat-icon>
      Add Patient

    </button>

  </div>

  <div class="toolbar">

    <div class="patient-summary">
      <mat-icon color="primary">groups</mat-icon>
      <div>
        <span class="count">{{ totalRecords }}</span>
        <small>Total Patients</small>
      </div>
    </div>

    <mat-form-field appearance="outline" class="search-box">
      <mat-icon matPrefix>search</mat-icon>
      <input
        matInput
        placeholder="Search patients..." />
    </mat-form-field>

  </div>

</div>
<mat-card>


   <mat-card-content>
    <!-- Top Pagination -->
    <div class="top-paginator">
      <mat-paginator
        [length]="totalRecords"
        [pageSize]="pageSize"
        [pageSizeOptions]="[5, 10, 20, 50]"
        [pageIndex]="pageNumber - 1"
        showFirstLastButtons
        (page)="onPageChange($event)">
      </mat-paginator>
    </div>
  <div class="table-container">

  <table mat-table [dataSource]="patients" class="mat-elevation-z2">

    <ng-container matColumnDef="patient">
  <th mat-header-cell *matHeaderCellDef>Patient</th>

  <td mat-cell *matCellDef="let patient">

    <div class="patient-info">

      <div class="patient-avatar">
        <mat-icon>person</mat-icon>
      </div>

      <div class="patient-details">

        <div class="patient-name">
          {{ patient.firstName }} {{ patient.lastName }}
        </div>

        <!-- <div class="patient-id">
          ID : {{ patient.id }}
        </div> -->

      </div>

    </div>

  </td>
</ng-container>
<ng-container matColumnDef="gender">

  <th mat-header-cell *matHeaderCellDef>
    Gender
  </th>

  <td mat-cell *matCellDef="let patient">

    <span
      class="gender-chip"
      [ngClass]="{
        'male': patient.gender === 1,
        'female': patient.gender === 2,
        'other': patient.gender === 3
      }">

      {{ getGender(patient.gender) }}

    </span>

  </td>

</ng-container>

    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Phone</th>
      <td mat-cell *matCellDef="let patient">
        {{patient.phoneNumber}}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>

      <td mat-cell *matCellDef="let patient">

  <div class="action-buttons">

    <button
  mat-icon-button
  color="primary"
  matTooltip="Edit Patient"
  (click)="editPatient(patient)">

  <mat-icon>edit</mat-icon>

</button>
    <button
      mat-icon-button
      color="warn"
      matTooltip="Delete Patient">

      <mat-icon>delete</mat-icon>

    </button>

  </div>

</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

  </table>
  </div>
  
</mat-card-content>
</mat-card>
</div>
